[project]
name = "voxel"
version = "0.1.0"
description = "Design LEGO builds from only the pieces you own."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bricklayer-sdk", "brickwright", "mcp"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
