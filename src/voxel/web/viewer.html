<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Live Build</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed 3D stage with a thin status header on top and a run timeline plus stats along the bottom. */
:root {
  --bg: #0c1016;
  --bg-2: #161d27;
  --panel: rgba(18, 24, 33, 0.78);
  --line: rgba(255, 255, 255, 0.10);
  --fg: #e9eef4;
  --muted: #8d99a8;
  --accent: #ffcf1a;
  --pass: #46c37b;
  --fail: #ff6a58;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-display); font-size: 14px; overflow: hidden;
}
#stage {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 38%, var(--bg-2) 0%, var(--bg) 70%);
  touch-action: none; cursor: grab;
}
#stage:active { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
.ui {
  position: absolute; left: 0; right: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { top: env(safe-area-inset-top, 0px); padding-block: 16px 0; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.bottom { bottom: env(safe-area-inset-bottom, 0px); padding-block: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.brand { font-weight: 600; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.status { margin-top: 6px; font-size: 22px; font-weight: 500; line-height: 1.2; max-width: 26ch; text-wrap: balance; }
.sub { margin-top: 6px; font-family: var(--font-data); font-size: 12px; color: var(--muted); min-height: 1.4em; max-width: 44ch; }
.sub.fail { color: var(--fail); }
.sub.pass { color: var(--pass); }
.btns { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
button {
  font: 500 12px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 12px; cursor: pointer; backdrop-filter: blur(6px);
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.run { display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
.pip {
  font-family: var(--font-data); font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); background: var(--panel); border-radius: 4px;
  padding: 4px 8px; display: flex; gap: 6px; align-items: center; backdrop-filter: blur(6px);
}
.pip i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: block; }
.pip.now { color: var(--fg); border-color: var(--accent); }
.pip.now i { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.pip.pass i { background: var(--pass); }
.pip.fail i { background: var(--fail); }
.pip.pass, .pip.fail { color: var(--fg); }
@keyframes pulse { 50% { opacity: 0.35; } }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.stats b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.hint { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
@media (max-width: 560px) { .status { font-size: 18px; } .top { flex-direction: column; } .btns { justify-content: flex-start; } }
@media (prefers-reduced-motion: reduce) { .pip.now i { animation: none; } }
</style>

<div id="stage" aria-label="3D build view. Drag to rotate, scroll to zoom."></div>

<div class="ui top">
  <div>
    <div class="brand">Voxel</div>
    <div class="status" id="status" aria-live="polite">Reading your parts</div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="btns">
    <button id="bSound" aria-pressed="true">Sound on</button>
    <button id="bSpeed">Speed: Game</button>
    <button id="bRebuild" aria-pressed="true">Rebuild each attempt</button>
    <button id="bOrbit" aria-pressed="true">Auto spin</button>
    <button id="bReset">Reset view</button>
    <button id="bReplay">Replay run</button>
  </div>
</div>

<div class="ui bottom">
  <div class="run" id="run"></div>
  <div class="stats">
    <span>Bricks <b id="sBricks">0</b></span>
    <span>Layers <b id="sLayers">0</b></span>
    <span>Parts <b id="sParts">0</b></span>
    <span class="hint">Drag to rotate, scroll or pinch to zoom</span>
    <span class="hint" id="sndNote" hidden></span>
    <span class="hint" id="rmNote" hidden>Your system has reduced motion on, so auto spin and dust puffs are off.</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/LDrawLoader.js"></script>
<script>
(async () => {
  const DATA = await (await fetch("/data.json")).json();
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");

  /* ---------- renderer / scene ---------- */
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 400);

  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x2a2118, 0.85));
  const sun = new THREE.DirectionalLight(0xfff2da, 0.95);
  sun.position.set(14, 34, 18);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 30, bottom: -26, near: 1, far: 100 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x6fa8ff, 0.35);
  rim.position.set(-20, 12, -18);
  scene.add(rim);

  /* ground: shadow catcher plus a baseplate-style stud grid */
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.35 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const grid = new THREE.GridHelper(40, 40, 0x1d2631, 0x141a22);
  grid.position.y = -0.01; scene.add(grid);

  /* scan plane that sweeps the build while the model is thinking */
  const scan = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ color: 0xffcf1a, transparent: true, opacity: 0.0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  scan.rotation.x = -Math.PI / 2; scene.add(scan);

  /* ---------- bounds from the final version ---------- */
  const final = DATA.versions[DATA.versions.length - 1].bricks;
  let W = 0, D = 0, H = 0;
  for (const v of DATA.versions) for (const b of v.bricks) { W = Math.max(W, b[3]); D = Math.max(D, b[4]); H = Math.max(H, b[5]); }
  const CX = W / 2, CZ = D / 2;
  const reach = Math.max(W, D, H);

  /* ---------- camera rig (own orbit controls) ---------- */
  const rig = { az: 0.7, el: 0.38, dist: reach * 1.9, tx: 0, ty: H * 0.4, tz: 0 };
  const goal = { az: 0.7, el: 0.38, dist: reach * 1.9, ty: H * 0.4 };
  const SPEEDS = [{ name: "Game", m: 1, cap: 45, drop: 0.7 }, { name: "Relaxed", m: 2.1, cap: 90, drop: 1.1 }, { name: "Fast", m: 0.4, cap: 8, drop: 0.35 }];
  let speedIdx = 0, rebuild = true, autoSpin = true, idleUntil = 0, spinBoost = 0;
  function placeCamera() {
    const ce = Math.cos(rig.el);
    camera.position.set(rig.tx + Math.sin(rig.az) * ce * rig.dist, rig.ty + Math.sin(rig.el) * rig.dist, rig.tz + Math.cos(rig.az) * ce * rig.dist);
    camera.lookAt(rig.tx, rig.ty, rig.tz);
  }
  const ptrs = new Map(); let pinch0 = 0;
  stage.addEventListener("pointerdown", (e) => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); } wake(); });
  stage.addEventListener("pointermove", (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 1) {
      goal.az -= (e.clientX - p[0]) * 0.007;
      goal.el = Math.min(1.45, Math.max(0.03, goal.el + (e.clientY - p[1]) * 0.006));
    } else if (ptrs.size === 2) {
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch0) goal.dist = clampDist(goal.dist * (pinch0 / d)); pinch0 = d;
    }
    ptrs.set(e.pointerId, [e.clientX, e.clientY]); wake();
  });
  const endPtr = (e) => { ptrs.delete(e.pointerId); pinch0 = 0; };
  stage.addEventListener("pointerup", endPtr); stage.addEventListener("pointercancel", endPtr);
  stage.addEventListener("wheel", (e) => { e.preventDefault(); goal.dist = clampDist(goal.dist * Math.exp(e.deltaY * 0.0011)); wake(); }, { passive: false });
  const clampDist = (d) => Math.min(reach * 4.2, Math.max(reach * 0.45, d));
  function wake() { idleUntil = performance.now() + 3500; }

  function resize() {
    const w = stage.clientWidth || 800, h = stage.clientHeight || 600;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 52 : 36; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  /* ---------- bricks ---------- */
  const matCache = new Map();
  const group = new THREE.Group(); scene.add(group);
  group.position.set(-CX, 0, CZ);
  const live = new Map();     // key -> brick record
  const anims = [];            // bricks currently moving
  const layerBricks = new Map();
  const keyOf = (b) => b.slice(0, 8).join("|");

  /* ---------- real LDraw shapes ---------- */
  const loader = new THREE.LDrawLoader();
  loader.setPath(""); loader.smoothNormals = true;
  const templates = new Map();   // "partIndex|colorIndex" -> loaded model
  function edgeOf(hex) { const c = new THREE.Color(hex); c.multiplyScalar(0.45); return c.getHexString(); }
  function loadTemplate(pi, ci) {
    const key = pi + "|" + ci;
    if (templates.has(key)) return Promise.resolve();
    const [hex, , finish] = DATA.palette[ci];
    const q = new URLSearchParams({ file: DATA.parts[pi][2], code: 4000 + ci, hex: hex.replace("#", ""), edge: edgeOf(hex) });
    if (/TRANS/i.test(finish)) q.set("alpha", 150);
    return new Promise((res) => {
      loader.load("model?" + q, (g) => { templates.set(key, g); res(); }, undefined, (e) => { console.warn("part failed", DATA.parts[pi][2], e); res(); });
    });
  }
  async function preload() {
    const need = new Map();
    for (const v of DATA.versions) for (const b of v.bricks) need.set(b[7] + "|" + b[6], [b[7], b[6]]);
    let n = 0; const total = need.size;
    for (const [, [pi, ci]] of need) { await loadTemplate(pi, ci); n++; if (n % 3 === 0 || n === total) sub.textContent = "Loading part shapes " + n + " of " + total; }
  }

  function makeBrick(b, shift) {
    const [x0, y0, z0, x1, y1, z1, ci, pi, layer] = b;
    const tpl = templates.get(pi + "|" + ci);
    const drop = new THREE.Group(); drop.position.set(-shift[0], 0, shift[1]);
    const flip = new THREE.Group(); flip.scale.set(0.05, -0.05, -0.05);
    const mats = [];
    if (tpl) {
      const inner = tpl.clone(true);
      inner.traverse((o) => { if (o.isMesh) { o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone(); for (const m of [].concat(o.material)) { if (m.color) m.color.convertSRGBToLinear(); if (m.emissive) mats.push(m); } o.castShadow = true; o.receiveShadow = true; } });
      const m = b.slice(9, 21);
      inner.matrixAutoUpdate = false;
      inner.matrix.set(m[3], m[4], m[5], m[0], m[6], m[7], m[8], m[1], m[9], m[10], m[11], m[2], 0, 0, 0, 1);
      flip.add(inner);
    }
    drop.add(flip);
    return { key: keyOf(b), data: b, g: drop, mats, base: 0, state: "idle", t0: 0, delay: 0, top: z1 };
  }

  /* ---------- audio (synthesised, original) ---------- */
  let actx = null, master = null, soundOn = true, lastClick = 0, lastChime = 0;
  function audio() {
    if (!soundOn) return null;
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination); } catch (e) { return null; }
    }
    if (actx.state === "suspended") actx.resume().catch(() => {});
    return actx.state === "running" ? actx : null;
  }
  const noiseBuf = () => { const n = actx.sampleRate * 0.05, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); return buf; };
  let nb = null;
  function click(h, vol = 1) {
    const a = audio(); if (!a) return;
    const now = a.currentTime; if (now - lastClick < 0.04) return; lastClick = now;
    if (custom.place.length) { playBuf(pick(custom.place), 0.9 * vol, 0.94 + Math.random() * 0.14); return; }
    if (!nb) nb = noiseBuf();
    const src = a.createBufferSource(); src.buffer = nb;
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2600 + Math.random() * 900 + h * 40; bp.Q.value = 1.4;
    const g = a.createGain(); g.gain.setValueAtTime(0.55 * vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(now);
    const o = a.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(240 + Math.random() * 60 + h * 6, now); o.frequency.exponentialRampToValueAtTime(130, now + 0.06);
    const g2 = a.createGain(); g2.gain.setValueAtTime(0.22 * vol, now); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    o.connect(g2); g2.connect(master); o.start(now); o.stop(now + 0.09);
  }
  function tone(freq, when, dur, vol, type = "sine") {
    const a = audio(); if (!a) return;
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  function chime(layer) {
    const a = audio(); if (!a) return; const now = a.currentTime; if (now - lastChime < 0.35) return; lastChime = now;
    if (custom.layer.length) { playBuf(pick(custom.layer), 0.8, 1); return; }
    tone(PENTA[layer % PENTA.length], 0, 0.5, 0.07); tone(PENTA[layer % PENTA.length] * 1.5, 0.06, 0.45, 0.04);
  }
  function fanfare() { if (custom.done.length) { playBuf(pick(custom.done), 1, 1); return; } [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { tone(f, i * 0.11, 0.7, 0.1); tone(f * 2, i * 0.11, 0.5, 0.03); }); }
  function buzz() { if (custom.fail.length) { playBuf(pick(custom.fail), 0.9, 1); return; } tone(220, 0, 0.18, 0.08, "square"); tone(165, 0.14, 0.28, 0.08, "square"); }
  const custom = { place: [], layer: [], done: [], fail: [] };
  function playBuf(buf, vol, rate) {
    const a = audio(); if (!a) return;
    const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; s.playbackRate.value = rate || 1; g.gain.value = vol;
    s.connect(g); g.connect(master); s.start();
  }
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  async function loadSounds() {
    try {
      const names = await (await fetch("/sounds/list")).json();
      if (!names.length) return;
      audio(); if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination); }
      for (const n of names) {
        const kind = ["place", "layer", "done", "fail"].find((k) => n.toLowerCase().startsWith(k)); if (!kind) continue;
        try { const buf = await actx.decodeAudioData(await (await fetch("/sounds/" + encodeURIComponent(n))).arrayBuffer()); custom[kind].push(buf); } catch (e) { console.warn("could not read sound", n); }
      }
      const note = $("sndNote"); const total = Object.values(custom).reduce((n, l) => n + l.length, 0);
      if (total) { note.hidden = false; note.textContent = "Your sounds: " + Object.entries(custom).map(([k, l]) => l.length + " " + k).join(", "); }
    } catch (e) { /* no sounds folder, the built in sounds are used */ }
  }
  const unlock = () => { audio(); };
  addEventListener("pointerdown", unlock, { passive: true }); addEventListener("keydown", unlock);

  /* ---------- dust puffs ---------- */
  const PN = 700, ppos = new Float32Array(PN * 3), pcol = new Float32Array(PN * 3), pvel = new Float32Array(PN * 3), plife = new Float32Array(PN);
  const pgeo = new THREE.BufferGeometry();
  pgeo.setAttribute("position", new THREE.BufferAttribute(ppos, 3)); pgeo.setAttribute("color", new THREE.BufferAttribute(pcol, 3));
  const pts = new THREE.Points(pgeo, new THREE.PointsMaterial({ size: 0.28, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
  pts.frustumCulled = false; scene.add(pts); let pi = 0;
  const tmpC = new THREE.Color();
  function puff(brick) {
    if (REDUCED) return;
    const d = brick.data, cx = (d[0] + d[3]) / 2 - CX, cz = (d[1] + d[4]) / 2 - CZ, y = d[2] + 0.1;
    tmpC.set(DATA.palette[d[6]][0]).convertSRGBToLinear().lerp(new THREE.Color(0xffffff), 0.5);
    for (let k = 0; k < 5; k++) {
      const i = pi++ % PN, a = Math.random() * 6.283, s = 0.6 + Math.random() * 1.1;
      ppos.set([cx + (Math.random() - 0.5) * (d[3] - d[0]) * 0.8, y, cz + (Math.random() - 0.5) * (d[4] - d[1]) * 0.8], i * 3);
      pvel.set([Math.cos(a) * s, 0.5 + Math.random() * 0.9, Math.sin(a) * s], i * 3);
      plife[i] = 1; pcol.set([tmpC.r * 0.55, tmpC.g * 0.55, tmpC.b * 0.55], i * 3);
    }
  }
  function stepPuffs(dt) {
    for (let i = 0; i < PN; i++) {
      if (plife[i] <= 0) { pcol[i * 3] = pcol[i * 3 + 1] = pcol[i * 3 + 2] = 0; continue; }
      plife[i] -= dt * 2.2; const f = Math.max(plife[i], 0);
      ppos[i * 3] += pvel[i * 3] * dt; ppos[i * 3 + 1] += pvel[i * 3 + 1] * dt; ppos[i * 3 + 2] += pvel[i * 3 + 2] * dt;
      pvel[i * 3] *= 0.94; pvel[i * 3 + 2] *= 0.94; pvel[i * 3 + 1] -= dt * 1.2;
      const k = f * f; pcol[i * 3] *= 0.9 + 0.1 * k; pcol[i * 3 + 1] *= 0.9 + 0.1 * k; pcol[i * 3 + 2] *= 0.9 + 0.1 * k;
      if (f <= 0) pcol[i * 3] = pcol[i * 3 + 1] = pcol[i * 3 + 2] = 0;
    }
    pgeo.attributes.position.needsUpdate = true; pgeo.attributes.color.needsUpdate = true;
  }

  /* ---------- applying a version (the live part) ---------- */
  const easeOutBack = (t) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  let clock = 0;
  const layerLeft = new Map();

  function applyVersion(v) {
    const again = rebuild && live.size > 0;   // clear the old attempt, then lay every brick again
    const next = again ? new Map() : new Map(v.bricks.map((b) => [keyOf(b), b]));
    let removed = 0;
    for (const [k, rec] of live) {
      if (!next.has(k)) { rec.state = "out"; rec.t0 = clock + removed * (again ? 0.005 : 0.012); anims.push(rec); live.delete(k); removed++; }
    }
    const add = v.bricks.filter((b) => !live.has(keyOf(b))).sort((a, b) => a[8] - b[8] || a[1] - b[1] || a[0] - b[0]);
        const base = clock + (again ? removed * 0.005 + 0.55 : removed ? 0.35 : 0.05);
    const sp = SPEEDS[speedIdx], per = 0.2 * sp.m, gap = 0.45 * sp.m;
    const raw = add.length * per + new Set(add.map((b) => b[8])).size * gap, k = raw > sp.cap ? sp.cap / raw : 1;
    let tt = 0, prevLayer = null;
    layerLeft.clear();
    add.forEach((b, i) => {
      const rec = makeBrick(b, v.shift); rec.state = "in"; rec.drop = sp.drop; if (prevLayer !== null && b[8] !== prevLayer) tt += gap * k; prevLayer = b[8]; rec.t0 = base + tt; tt += per * k; rec.layer = b[8];
      rec.g.visible = false; group.add(rec.g); live.set(rec.key, rec); anims.push(rec);
      layerLeft.set(b[8], (layerLeft.get(b[8]) || 0) + 1);
      if (!layerBricks.has(b[8])) layerBricks.set(b[8], []);
      layerBricks.get(b[8]).push(rec);
    });
    for (const [k, list] of [...layerBricks]) layerBricks.set(k, list.filter((r) => live.has(r.key)));
    const dur = base - clock + tt + sp.drop + 0.4;
    return { added: add.length, removed, dur, again };
  }

  /* ---------- a failed check: show what is wrong in red, then blow the build apart ---------- */
  let redOn = false, shake = 0;
  const booms = [];
  const tmpBox = new THREE.Box3();
  function flagRed() {
    redOn = true;
    const any = [...live.values()].some((r) => r.data[21]);
    for (const r of live.values()) {
      if (r.data[21]) { r.flagged = true; for (const m of r.mats) m.emissive.set(0xff2200); }
      else if (any) for (const m of r.mats) m.color.multiplyScalar(0.35);   // dim everything that is fine
    }
  }
  function pulseRed(now) {
    if (!redOn) return;
    const k = 0.9 + 0.6 * Math.sin(now / 90);
    for (const r of live.values()) if (r.flagged) for (const m of r.mats) m.emissiveIntensity = k;
  }
  function breakApart() {
    redOn = false; shake = 1;
    group.updateMatrixWorld(true);
    const mid = new THREE.Vector3(0, H * 0.35, 0);
    for (const r of live.values()) {
      tmpBox.setFromObject(r.g);
      const c = tmpBox.getCenter(new THREE.Vector3());
      const piv = new THREE.Group(); piv.position.copy(group.worldToLocal(c.clone())); group.add(piv); piv.attach(r.g);
      const dir = c.clone().sub(mid); dir.y *= 0.5; if (dir.lengthSq() < 0.01) dir.set(Math.random() - 0.5, 0.5, Math.random() - 0.5); dir.normalize();
      const sp = 3 + Math.random() * 7;
      booms.push({
        piv, r, t: 0, life: 2.3 + Math.random() * 0.5,
        vel: new THREE.Vector3(dir.x * sp + (Math.random() - 0.5) * 3, 3 + Math.random() * 8 + dir.y * 3, dir.z * sp + (Math.random() - 0.5) * 3),
        spin: new THREE.Vector3((Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16)
      });
      puff(r);
    }
    live.clear(); anims.length = 0; layerBricks.clear(); glowList = []; stats();
  }
  function stepBooms(dt) {
    for (let i = booms.length - 1; i >= 0; i--) {
      const b = booms[i]; b.t += dt;
      b.vel.y -= 24 * dt;
      b.piv.position.addScaledVector(b.vel, dt);
      b.piv.rotation.x += b.spin.x * dt; b.piv.rotation.y += b.spin.y * dt; b.piv.rotation.z += b.spin.z * dt;
      if (b.piv.position.y < 0.3) { b.piv.position.y = 0.3; b.vel.y *= -0.38; b.vel.x *= 0.72; b.vel.z *= 0.72; b.spin.multiplyScalar(0.7); }
      const fade = b.t - (b.life - 0.7);
      if (fade > 0) b.piv.scale.setScalar(Math.max(0, 1 - fade / 0.7));
      if (b.t >= b.life) { group.remove(b.piv); b.r.mats.forEach((m) => m.dispose()); booms.splice(i, 1); }
    }
  }

  let glowList = [];
  function glowLayer(layer) { for (const r of layerBricks.get(layer) || []) glowList.push({ r, t: 0 }); }

  function updateBricks(dt) {
    for (let i = anims.length - 1; i >= 0; i--) {
      const r = anims[i];
      if (clock < r.t0) continue;
      const t = (clock - r.t0);
      if (r.state === "in") {
        r.g.visible = true;
        const u = Math.min(t / (r.drop || 0.6), 1);
        r.g.position.y = r.base + (1 - easeOutBack(u)) * 7;
        r.g.scale.setScalar(0.92 + 0.08 * u);
        if (u >= 1) {
          r.state = "idle"; r.g.position.y = r.base; r.g.scale.setScalar(1); anims.splice(i, 1);
          click(r.layer, 0.8); puff(r);
          const left = (layerLeft.get(r.layer) || 1) - 1; layerLeft.set(r.layer, left);
          if (left === 0) { chime(r.layer); glowLayer(r.layer); }
          stats();
        }
      } else if (r.state === "out") {
        const u = Math.min(t / 0.28, 1);
        r.g.scale.setScalar(1 - u); r.g.position.y = r.base + u * 1.5;
        if (u >= 1) { group.remove(r.g); r.mats.forEach((m) => m.dispose()); anims.splice(i, 1); stats(); }
      }
    }
    for (let i = glowList.length - 1; i >= 0; i--) {
      const g = glowList[i]; g.t += dt / 0.7; const k = Math.max(0, 1 - g.t);
      for (const m of g.r.mats) m.emissiveIntensity = 0.45 * k * k;
      if (g.t >= 1) { for (const m of g.r.mats) m.emissiveIntensity = 0; glowList.splice(i, 1); }
    }
  }

  function stats() {
    let n = 0, top = 0; const layers = new Set(), parts = new Set();
    for (const r of live.values()) if (r.state !== "in" || r.g.visible) { n++; layers.add(r.data[8]); parts.add(r.data[7] + ":" + r.data[6]); top = Math.max(top, r.top); }
    $("sBricks").textContent = n; $("sLayers").textContent = layers.size; $("sParts").textContent = parts.size;
    goal.ty = Math.max(H * 0.18, top * 0.48);
  }

  /* ---------- the live run ---------- */
  const status = $("status"), sub = $("sub"), runEl = $("run");
  let thinking = false, timers = [], runId = 0;
  const later = (ms, fn) => { const id = runId; timers.push(setTimeout(() => { if (id === runId) fn(); }, ms)); };
  function setStatus(a, b, cls) { status.textContent = a; sub.textContent = b || ""; sub.className = "sub " + (cls || ""); }
  function pips(now, doneUpTo) {
    runEl.innerHTML = "";
    DATA.versions.forEach((v, i) => {
      const el = document.createElement("div");
      const state = i < doneUpTo ? (v.ok ? "pass" : "fail") : i === now ? "now" : "";
      el.className = "pip " + state; el.innerHTML = "<i></i>Attempt " + (i + 1);
      runEl.appendChild(el);
    });
  }

  function clearAll() {
    runId++; timers.forEach(clearTimeout); timers = [];
    for (const r of [...live.values(), ...anims]) { group.remove(r.g); }
    live.clear(); anims.length = 0; layerBricks.clear(); glowList = []; thinking = false; spinBoost = 0;
    stats();
  }

  function start() {
    clearAll(); pips(-1, 0);
    goal.az = 0.7; goal.el = 0.38; goal.dist = reach * 1.9;
    setStatus("Reading your parts", "Loading part shapes");
    later(1700, () => attempt(0));
  }

  /* While one attempt is being laid brick by brick, the model is already working on the next one.
     The next attempt starts building once it has arrived and the current build has finished. */
  const THINK_MS = 1000;
  function attempt(i) {
    const v = DATA.versions[i], last = i === DATA.versions.length - 1;
    thinking = true; pips(i, i);
    setStatus(i === 0 ? "Designing" : "Fixing the design", i === 0 ? "Planning the shape from your parts" : "Reworking the last attempt", "");
    later(i === 0 ? 6000 : 800, () => {
      thinking = false;
      const res = applyVersion(v);
      const note = res.again ? res.added + " bricks, laid again from the ground up" : res.added + " placed" + (res.removed ? ", " + res.removed + " replaced" : "");
      setStatus("Building attempt " + (i + 1), last ? note : note + ". Claude is already working on the next attempt.", "");
      let buildDone = false, thinkDone = last, moved = false;
      const go = () => { if (buildDone && thinkDone && !moved) { moved = true; later(600, () => attempt(i + 1)); } };
      later(res.dur * 1000, () => {
        pips(i, i + 1);
        const finish = () => {
          buildDone = true;
          if (last && v.ok) { fanfare(); spinBoost = 1; for (const l of layerBricks.keys()) later(l * 45, () => glowLayer(l)); setStatus("Build complete", "Passed every check. " + live.size + " bricks, all owned.", "pass"); }
          else if (last) { setStatus("Could not finish", v.note, "fail"); }
          else { thinking = !thinkDone; go(); }
        };
        if (v.ok) { setStatus(last ? "Build complete" : "Checks passed", "Every piece is one you own", "pass"); finish(); }
        else {
          setStatus("Check failed", v.note, "fail"); flagRed();
          later(2300, () => { breakApart(); buzz(); later(2600, finish); });
        }
      });
      if (!last) later(THINK_MS, () => { thinkDone = true; thinking = false; go(); });
    });
  }

  /* ---------- buttons ---------- */
  $("bSound").onclick = (e) => { soundOn = !soundOn; e.currentTarget.setAttribute("aria-pressed", soundOn); e.currentTarget.textContent = soundOn ? "Sound on" : "Sound off"; if (soundOn) audio(); };
  $("bSpeed").onclick = (e) => { speedIdx = (speedIdx + 1) % SPEEDS.length; e.currentTarget.textContent = "Speed: " + SPEEDS[speedIdx].name; };
  $("bRebuild").onclick = (e) => { rebuild = !rebuild; e.currentTarget.setAttribute("aria-pressed", rebuild); };
  $("bOrbit").onclick = (e) => { autoSpin = !autoSpin; e.currentTarget.setAttribute("aria-pressed", autoSpin); };
  $("bReset").onclick = () => { goal.az = Math.round(goal.az / 6.2832) * 6.2832 + 0.7; goal.el = 0.38; goal.dist = reach * 1.9; };
  $("bReplay").onclick = start;

  /* ---------- frame loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; clock += dt;
    if (autoSpin && !REDUCED && now > idleUntil) goal.az += dt * (0.16 + spinBoost * 0.2);
    const k = 1 - Math.pow(0.001, dt);
    rig.az += (goal.az - rig.az) * k; rig.el += (goal.el - rig.el) * k; rig.dist += (goal.dist - rig.dist) * k; rig.ty += (goal.ty - rig.ty) * k;
    placeCamera();
    if (shake > 0.01) { const a = shake * reach * 0.012; camera.position.x += (Math.random() - 0.5) * a; camera.position.y += (Math.random() - 0.5) * a; shake *= 0.92; }
    updateBricks(dt); stepPuffs(dt); stepBooms(dt); pulseRed(now);
    /* scan plane */
    const tgt = thinking ? 0.16 : 0, so = scan.material.opacity; scan.material.opacity += (tgt - so) * Math.min(1, dt * 4);
    if (scan.material.opacity > 0.005) {
      let top = 1; for (const r of live.values()) top = Math.max(top, r.top);
      scan.scale.set(W + 3, D + 3, 1); scan.position.set(0, ((Math.sin(now / 700) + 1) / 2) * top + 0.05, 0);
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  if (REDUCED) $("rmNote").hidden = false;
  stats(); pips(-1, 0); placeCamera(); requestAnimationFrame(frame);
  setStatus("Reading your parts", "Loading part shapes"); await preload(); loadSounds(); start();
  window.__voxel = { applyVersion, live, start };
})();
</script>
